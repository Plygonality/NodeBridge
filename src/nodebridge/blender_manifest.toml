schema_version = "1.0.0"

id = "nodebridge"
version = "0.4.0"
name = "NodeBridge"
tagline = "Native Houdini and Unreal code, plus optional OpenUSD bundles"
maintainer = "NodeBridge Contributors"
type = "add-on"
website = "https://github.com/Plygonality/NodeBridge"
tags = ["Node", "Pipeline", "Import-Export"]
blender_version_min = "4.2.0"
license = ["SPDX:MIT"]

[permissions]
files = "Save generated scripts and OpenUSD bundles to disk"
clipboard = "Copy generated code and translation reports"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc", ".*"]
