[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nodebridge"
version = "0.1.0"
description = "Cross-DCC procedural graph translation framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NodeBridge Contributors" }]
keywords = [
    "blender",
    "houdini",
    "unreal",
    "procedural",
    "geometry-nodes",
    "intermediate-representation",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nodebridge = "nodebridge.cli.main:main"

[project.urls]
Homepage = "https://github.com/Plygonality/NodeBridge"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nodebridge = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
