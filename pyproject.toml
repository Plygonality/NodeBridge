[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nodebridge"
version = "0.3.0"
description = "Cross-DCC procedural compiler: Blender node trees to native Houdini and Unreal Engine 5 code"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NodeBridge Contributors" }]
keywords = ["blender", "houdini", "unreal", "pcg", "geometry-nodes", "procedural", "compiler", "blender-addon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nodebridge = "nodebridge.cli:main"

[project.urls]
Homepage = "https://github.com/Plygonality/NodeBridge"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nodebridge = ["blender_manifest.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
