name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Pytest, including escape and crash tests
        run: python -m pytest -q

  # Ruff and mypy stay informational until the existing baseline is cleaned up.
  # continue-on-error belongs on the steps: on the job, GitHub still reports the check as failed.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]" ruff mypy
      - name: Ruff
        continue-on-error: true
        run: ruff check src tests
      - name: Mypy
        continue-on-error: true
        run: mypy src
